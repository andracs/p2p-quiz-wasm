[package]
name = "p2p-quiz-wasm"
version = "0.1.0"
edition = "2021"
description = "Quiz domain logic for P2P Quiz Wasm: a replicated event log reduced to quiz state."
publish = false

[lib]
# cdylib for WebAssembly, rlib so `cargo test` can run the unit tests natively.
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
wasm-bindgen = "0.2"

[profile.release]
opt-level = "s"
lto = true

# Skip wasm-opt: it is downloaded at build time and is not needed for a demo.
[package.metadata.wasm-pack.profile.release]
wasm-opt = false
